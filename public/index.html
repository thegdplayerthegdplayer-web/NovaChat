<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaChat AI</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101114;
  --sidebar: #17181d;
  --panel: #202127;
  --border: #303139;
  --text: #f4f4f6;
  --muted: #999ba8;
  --accent: #a78bfa;
  --accent2: #7c5ce7;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif;
  height: 100dvh;
  overflow: hidden;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.app { display: flex; height: 100dvh; }
.sidebar {
  width: 275px; flex-shrink: 0; background: var(--sidebar);
  border-right: 1px solid var(--border); display: flex;
  flex-direction: column; padding: 17px 12px; gap: 18px;
}
.brand { display:flex; align-items:center; gap:10px; padding:4px 8px; }
.logo {
  display:grid; place-items:center; width:36px; height:36px;
  border-radius:12px; background:linear-gradient(135deg,#b59aff,#6941d9);
  font-size:21px; color:white; font-weight:800;
}
.brand-name { font-size:19px; font-weight:750; letter-spacing:-.5px; }
.brand-sub { color:var(--muted); font-size:11px; }
.new-chat {
  border:1px solid var(--border); background:#24252c; border-radius:11px;
  padding:11px 12px; display:flex; justify-content:space-between;
  align-items:center; transition:.2s;
}
.new-chat:hover, .tool-button:hover { background:#30313a; }
.history-label {
  color:var(--muted); font-size:11px; text-transform:uppercase;
  letter-spacing:1.4px; padding:0 8px; font-weight:700;
}
.history { flex:1; overflow-y:auto; min-height:0; }
.chat-item {
  display:flex; align-items:center; gap:5px; padding:4px;
  border-radius:10px; margin-bottom:3px;
}
.chat-item.active { background:#2b2936; }
.chat-select {
  flex:1; min-width:0; text-align:left; background:none; border:0;
  padding:8px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.chat-actions { display:flex; gap:2px; }
.small-btn {
  width:29px; height:29px; border:0; border-radius:7px;
  background:transparent; color:var(--muted); flex-shrink:0;
}
.small-btn:hover { background:#41414c; color:white; }
.sidebar-footer { border-top:1px solid var(--border); padding:14px 6px 0; }
.status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
.dot { width:8px; height:8px; border-radius:50%; background:#777; }
.dot.online { background:#42d392; box-shadow:0 0 9px #42d39266; }
.model-label { color:var(--muted); font-size:11px; margin:7px 0 0 16px; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar {
  height:62px; border-bottom:1px solid var(--border); display:flex;
  align-items:center; justify-content:space-between; padding:0 23px; flex-shrink:0;
}
.topbar-title { font-weight:650; }
.topbar-right { color:var(--muted); font-size:12px; }
.mobile-menu { display:none; background:none; border:0; font-size:22px; }
.messages {
  flex:1; overflow-y:auto; padding:30px 20px 24px;
  scroll-behavior:smooth;
}
.message-list { max-width:800px; margin:0 auto; }
.welcome { text-align:center; padding:10vh 10px 30px; }
.welcome-logo {
  margin:0 auto 22px; width:66px; height:66px; border-radius:22px;
  display:grid; place-items:center; font-size:34px;
  background:linear-gradient(135deg,#b59aff,#6941d9);
  box-shadow:0 12px 50px #8b5cf633;
}
.welcome h1 { font-size:clamp(28px,4vw,38px); letter-spacing:-1.2px; margin:0 0 10px; }
.gradient { background:linear-gradient(90deg,#c4b5fd,#8b76ff); color:transparent; background-clip:text; }
.welcome p { color:var(--muted); margin:0 auto; max-width:450px; }
.suggestions {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px; margin:30px auto 0; max-width:620px;
}
.suggestion {
  text-align:left; padding:15px; border:1px solid var(--border);
  border-radius:13px; background:#191a20; transition:.2s;
}
.suggestion:hover { border-color:#8270bf; background:#22202b; }
.suggestion strong { display:block; font-size:13px; margin-bottom:4px; }
.suggestion span { color:var(--muted); font-size:12px; }
.message { display:flex; gap:13px; margin:0 auto 26px; max-width:760px; }
.avatar {
  width:32px; height:32px; border-radius:11px; display:grid;
  place-items:center; flex-shrink:0; font-size:14px; font-weight:750;
}
.avatar.user { background:#30313a; }
.avatar.ai { background:linear-gradient(135deg,#b59aff,#6941d9); }
.message-body { min-width:0; flex:1; }
.message-heading { font-weight:650; font-size:13px; margin:4px 0 8px; }
.message-content { line-height:1.75; overflow-wrap:anywhere; white-space:pre-wrap; }
.message-content pre {
  white-space:pre-wrap; overflow-x:auto; background:#14151a;
  border:1px solid var(--border); border-radius:10px; padding:13px;
}
.message-content code { background:#292a32; border-radius:4px; padding:2px 5px; font-size:.92em; }
.message-content pre code { background:none; padding:0; }
.message-tools { display:flex; gap:5px; margin-top:8px; }
.message-tools button {
  color:var(--muted); background:transparent; border:1px solid transparent;
  border-radius:7px; padding:4px 8px; font-size:12px;
}
.message-tools button:hover { background:#25262d; border-color:var(--border); color:white; }
.typing { display:flex; gap:5px; padding:9px 0; }
.typing span { width:7px; height:7px; border-radius:50%; background:#b6a3f9; animation:bounce .9s infinite alternate; }
.typing span:nth-child(2) { animation-delay:.2s; }
.typing span:nth-child(3) { animation-delay:.4s; }
@keyframes bounce { to { opacity:.35; transform:translateY(-5px); } }
.composer-area { padding:12px 20px 19px; flex-shrink:0; }
.composer-wrap { max-width:800px; margin:0 auto; }
.composer {
  border:1px solid #3a3b45; border-radius:17px; padding:10px 11px 8px;
  background:#1b1c22; box-shadow:0 8px 35px #0002;
}
.composer:focus-within { border-color:#7460b4; }
#prompt {
  width:100%; resize:none; max-height:180px; min-height:29px;
  background:transparent; color:var(--text); border:0; outline:0;
  padding:5px 5px; line-height:1.5;
}
#prompt::placeholder { color:#858693; }
.composer-bottom { display:flex; align-items:center; justify-content:space-between; padding-top:6px; }
.composer-hint { color:var(--muted); font-size:11px; padding-left:5px; }
.send-btn {
  width:37px; height:37px; border:0; border-radius:11px;
  background:var(--accent); color:#17131f; font-weight:900; font-size:20px;
}
.send-btn:hover { background:#c0aafa; }
.send-btn:disabled { opacity:.4; cursor:not-allowed; }
.disclaimer { color:#777985; text-align:center; font-size:11px; margin-top:10px; }
.toast {
  position:fixed; bottom:105px; left:50%; transform:translateX(-50%);
  background:#30313a; border:1px solid #484955; border-radius:10px;
  padding:10px 15px; font-size:13px; box-shadow:0 8px 30px #0006;
  z-index:10; display:none;
}
.modal-backdrop {
  position:fixed; inset:0; background:#0009; z-index:20;
  display:none; place-items:center; padding:20px;
}
.modal {
  background:#202127; border:1px solid var(--border); border-radius:16px;
  padding:22px; width:min(400px,100%); box-shadow:0 20px 70px #0008;
}
.modal h3 { margin:0 0 7px; }
.modal p { color:var(--muted); font-size:13px; margin:0 0 17px; }
.modal input {
  width:100%; border:1px solid var(--border); border-radius:9px;
  padding:11px; background:#15161a; color:white; outline:0;
}
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:17px; }
.modal-actions button { border:1px solid var(--border); border-radius:9px; padding:9px 13px; background:#30313a; }
.modal-actions .primary { background:var(--accent); border-color:var(--accent); color:#16121e; }
.modal-actions .danger { background:#b83b4a; border-color:#b83b4a; color:white; }
.empty-history { color:var(--muted); font-size:12px; padding:12px 8px; }
@media(max-width:700px) {
  .sidebar { position:fixed; inset:0 auto 0 0; z-index:15; transform:translateX(-100%); transition:transform .2s; width:280px; box-shadow:10px 0 40px #0005; }
  .sidebar.open { transform:translateX(0); }
  .mobile-menu { display:block; }
  .topbar { padding:0 14px; gap:10px; }
  .topbar-right { font-size:11px; }
  .messages { padding:20px 13px; }
  .composer-area { padding:10px 12px 14px; }
  .welcome { padding-top:8vh; }
  .suggestions { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">✦</div>
      <div><div class="brand-name">NovaChat</div><div class="brand-sub">Your local AI assistant</div></div>
    </div>
    <button class="new-chat" id="newChatBtn"><span>＋ &nbsp; New chat</span><span>⌘</span></button>
    <div class="history-label">Your conversations</div>
    <div class="history" id="history"></div>
    <div class="sidebar-footer">
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking local AI…</span></div>
      <div class="model-label">Ollama · llama3.2:3b</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open sidebar">☰</button>
        <div class="topbar-title" id="topTitle">New conversation</div>
      </div>
      <div class="topbar-right">✦ &nbsp; Powered by local AI</div>
    </header>

    <section class="messages" id="messages">
      <div class="message-list" id="messageList"></div>
    </section>

    <div class="composer-area">
      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="Message NovaChat…" autocomplete="off"></textarea>
          <div class="composer-bottom">
            <span class="composer-hint">Enter to send · Shift + Enter for a new line</span>
            <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">↑</button>
          </div>
        </form>
        <div class="disclaimer">NovaChat can make mistakes. Verify important information.</div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Rename conversation</h3>
    <p id="modalDescription">Choose a name for this chat.</p>
    <input id="modalInput" maxlength="80" autocomplete="off">
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button class="primary" id="modalConfirm">Save name</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "novachat_saved_sessions_v1";
  const ACTIVE_KEY = "novachat_active_session_v1";
  const $ = id => document.getElementById(id);

  const historyEl = $("history");
  const messageList = $("messageList");
  const messagesEl = $("messages");
  const promptEl = $("prompt");
  const sendBtn = $("sendBtn");
  const toastEl = $("toast");
  const modalBackdrop = $("modalBackdrop");
  const modalInput = $("modalInput");

  let chats = loadChats();
  let activeId = localStorage.getItem(ACTIVE_KEY);
  let busy = false;
  let modalAction = null;
  let toastTimer;

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function loadChats() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(data)) return [];
      return data.filter(c =>
        c && typeof c.id === "string" &&
        typeof c.title === "string" && Array.isArray(c.messages)
      );
    } catch {
      return [];
    }
  }

  function saveChats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
      if (activeId) localStorage.setItem(ACTIVE_KEY, activeId);
      else localStorage.removeItem(ACTIVE_KEY);
    } catch {
      showToast("Couldn't save chats. Your browser storage may be full.");
    }
  }

  function currentChat() {
    return chats.find(c => c.id === activeId);
  }

  function createChat() {
    const chat = {
      id: makeId(),
      title: "New chat",
      messages: [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    chats.unshift(chat);
    activeId = chat.id;
    saveChats();
    renderAll();
    promptEl.focus();
    $("sidebar").classList.remove("open");
  }

  function setActive(id) {
    if (!chats.some(c => c.id === id)) return;
    activeId = id;
    saveChats();
    renderAll();
    $("sidebar").classList.remove("open");
    promptEl.focus();
  }

  function renameChat(id) {
    const chat = chats.find(c => c.id === id);
    if (!chat) return;
    openModal({
      title: "Rename conversation",
      description: "Choose a name that's easy to recognize.",
      value: chat.title,
      confirmLabel: "Save name",
      onConfirm: value => {
        const name = value.trim();
        if (!name) {
          showToast("Chat name can't be empty.");
          return false;
        }
        chat.title = name;
        chat.updatedAt = Date.now();
        saveChats();
        renderAll();
        showToast("Conversation renamed.");
        return true;
      }
    });
  }

  function deleteChat(id) {
    const chat = chats.find(c => c.id === id);
    if (!chat) return;
    openModal({
      title: "Delete conversation?",
      description: `“${chat.title}” will be permanently removed from this browser.`,
      value: "",
      confirmLabel: "Delete chat",
      danger: true,
      onConfirm: () => {
        chats = chats.filter(c => c.id !== id);
        if (activeId === id) {
          activeId = chats[0]?.id || null;
        }
        saveChats();
        renderAll();
        showToast("Conversation deleted.");
        return true;
      }
    });
  }

  function openModal(options) {
    modalAction = options.onConfirm;
    $("modalTitle").textContent = options.title;
    $("modalDescription").textContent = options.description;
    modalInput.value = options.value;
    $("modalConfirm").textContent = options.confirmLabel;
    $("modalConfirm").classList.toggle("danger", !!options.danger);
    $("modalConfirm").classList.toggle("primary", !options.danger);
    modalInput.style.display = options.danger ? "none" : "block";
    modalBackdrop.style.display = "grid";
    if (!options.danger) {
      setTimeout(() => {
        modalInput.focus();
        modalInput.select();
      }, 0);
    } else {
      modalInput.blur();
    }
  }

  function closeModal() {
    modalBackdrop.style.display = "none";
    modalAction = null;
  }

  $("modalCancel").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", e => {
    if (e.target === modalBackdrop) closeModal();
  });
  $("modalConfirm").addEventListener("click", () => {
    if (typeof modalAction !== "function") return;
    const result = modalAction(modalInput.value);
    if (result !== false) closeModal();
  });
  modalInput.addEventListener("keydown", e => {
    if (e.key === "Enter") $("modalConfirm").click();
    if (e.key === "Escape") closeModal();
  });

  function renderHistory() {
    historyEl.replaceChildren();

    if (!chats.length) {
      const empty = document.createElement("div");
      empty.className = "empty-history";
      empty.textContent = "Your saved chats will appear here.";
      historyEl.append(empty);
      return;
    }

    chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    for (const chat of chats) {
      const item = document.createElement("div");
      item.className = "chat-item" + (chat.id === activeId ? " active" : "");

      const select = document.createElement("button");
      select.className = "chat-select";
      select.textContent = chat.title || "New chat";
      select.title = chat.title;
      select.addEventListener("click", () => setActive(chat.id));

      const actions = document.createElement("div");
      actions.className = "chat-actions";

      const rename = document.createElement("button");
      rename.className = "small-btn";
      rename.textContent = "✎";
      rename.title = "Rename conversation";
      rename.setAttribute("aria-label", "Rename " + chat.title);
      rename.addEventListener("click", () => renameChat(chat.id));

      const del = document.createElement("button");
      del.className = "small-btn";
      del.textContent = "×";
      del.title = "Delete conversation";
      del.setAttribute("aria-label", "Delete " + chat.title);
      del.addEventListener("click", () => deleteChat(chat.id));

      actions.append(rename, del);
      item.append(select, actions);
      historyEl.append(item);
    }
  }

  function renderMarkdown(text) {
    // Escape HTML first, so AI output cannot inject HTML into the page.
    let safe = String(text).replace(/&/g, "&amp;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

    const blocks = [];
    safe = safe.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const token = `@@CODEBLOCK${blocks.length}@@`;
      blocks.push(`<pre><code>${code.trim()}</code></pre>`);
      return token;
    });

    safe = safe.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    safe = safe.replace(/(^|\n)### (.+)/g, "$1<strong>$2</strong>");
    safe = safe.replace(/(^|\n)## (.+)/g, "$1<strong>$2</strong>");
    safe = safe.replace(/(^|\n)# (.+)/g, "$1<strong>$2</strong>");
    safe = safe.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    safe = safe.replace(/(^|\n)[-•] (.+)/g, "$1• $2");
    safe = safe.replace(/\n/g, "<br>");

    safe = safe.replace(/@@CODEBLOCK(\d+)@@/g, (_, index) => blocks[Number(index)] || "");
    return safe;
  }

  function addMessageElement(message, index) {
    const row = document.createElement("article");
    row.className = "message";

    const avatar = document.createElement("div");
    avatar.className = "avatar " + (message.role === "user" ? "user" : "ai");
    avatar.textContent = message.role === "user" ? "Y" : "✦";

    const body = document.createElement("div");
    body.className = "message-body";

    const heading = document.createElement("div");
    heading.className = "message-heading";
    heading.textContent = message.role === "user" ? "You" : "NovaChat";

    const content = document.createElement("div");
    content.className = "message-content";
    content.innerHTML = renderMarkdown(message.content);

    body.append(heading, content);

    if (message.role === "assistant") {
      const tools = document.createElement("div");
      tools.className = "message-tools";
      const copy = document.createElement("button");
      copy.textContent = "▢ Copy";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(message.content);
          showToast("Response copied.");
        } catch {
          showToast("Clipboard access unavailable in this browser.");
        }
      });
      tools.append(copy);
      body.append(tools);
    }

    row.append(avatar, body);
    messageList.append(row);
  }

  function renderMessages() {
    messageList.replaceChildren();
    const chat = currentChat();
    $("topTitle").textContent = chat ? chat.title : "New conversation";

    if (!chat || chat.messages.length === 0) {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.innerHTML = `
        <div class="welcome-logo">✦</div>
        <h1>What can I help you <span class="gradient">with?</span></h1>
        <p>Your personal AI assistant, running locally on your computer.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Explain a difficult topic in simple words."><strong>📚 Learn something</strong><span>Explain a topic simply</span></button>
          <button class="suggestion" data-prompt="Help me write a creative story with an interesting twist."><strong>✍️ Write something</strong><span>Stories, ideas and writing</span></button>
          <button class="suggestion" data-prompt="Give me a useful beginner coding project and explain how to build it."><strong>💻 Code with me</strong><span>Build and debug projects</span></button>
          <button class="suggestion" data-prompt="Give me five creative project ideas I could build at home."><strong>💡 Brainstorm ideas</strong><span>Discover your next project</span></button>
        </div>`;
      messageList.append(welcome);
      welcome.querySelectorAll("[data-prompt]").forEach(button => {
        button.addEventListener("click", () => {
          promptEl.value = button.dataset.prompt;
          resizeInput();
          promptEl.focus();
        });
      });
    } else {
      chat.messages.forEach(addMessageElement);
    }

    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function renderAll() {
    renderHistory();
    renderMessages();
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.style.display = "none";
    }, 2600);
  }

  function resizeInput() {
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + "px";
  }

  function showTyping() {
    const row = document.createElement("article");
    row.className = "message";
    row.id = "typingIndicator";
    row.innerHTML = `
      <div class="avatar ai">✦</div>
      <div class="message-body">
        <div class="message-heading">NovaChat</div>
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    messageList.append(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage(text) {
    if (busy || !text.trim()) return;

    if (!currentChat()) createChat();
    const chat = currentChat();
    if (!chat) return;

    const content = text.trim();
    chat.messages.push({ role: "user", content });
    if (chat.title === "New chat") {
      chat.title = content.length > 34 ? content.slice(0, 34).trim() + "…" : content;
    }
    chat.updatedAt = Date.now();
    saveChats();
    renderAll();

    promptEl.value = "";
    resizeInput();
    busy = true;
    sendBtn.disabled = true;
    promptEl.disabled = true;
    showTyping();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chat.messages })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || `Server error (${response.status})`);
      }
      if (typeof data.reply !== "string") {
        throw new Error("The AI returned an invalid response.");
      }

      // A user may switch chats while the AI is answering.
      const stillExists = chats.find(c => c.id === chat.id);
      if (stillExists) {
        stillExists.messages.push({ role: "assistant", content: data.reply });
        stillExists.updatedAt = Date.now();
        saveChats();
      }
    } catch (error) {
      const stillExists = chats.find(c => c.id === chat.id);
      if (stillExists) {
        stillExists.messages.push({
          role: "assistant",
          content: "I couldn't get a response from the local AI.\n\n" +
            (error.message || "Unknown connection error") +
            "\n\nCheck that NovaChat's server and Ollama are running."
        });
        stillExists.updatedAt = Date.now();
        saveChats();
      }
    } finally {
      busy = false;
      sendBtn.disabled = false;
      promptEl.disabled = false;
      renderAll();
      promptEl.focus();
    }
  }

  async function checkStatus() {
    try {
      const response = await fetch("/api/status");
      const data = await response.json();
      const online = response.ok && data.configured === true;
      $("statusDot").classList.toggle("online", online);
      $("statusText").textContent = online ? "Local AI connected" : "Local AI unavailable";
    } catch {
      $("statusDot").classList.remove("online");
      $("statusText").textContent = "Server disconnected";
    }
  }

  $("newChatBtn").addEventListener("click", createChat);
  $("mobileMenu").addEventListener("click", () => {
    $("sidebar").classList.toggle("open");
  });

  $("chatForm").addEventListener("submit", event => {
    event.preventDefault();
    sendMessage(promptEl.value);
  });

  promptEl.addEventListener("input", resizeInput);
  promptEl.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      $("chatForm").requestSubmit();
    }
  });

  window.addEventListener("storage", event => {
    if (event.key === STORAGE_KEY) {
      chats = loadChats();
      if (!chats.some(c => c.id === activeId)) activeId = chats[0]?.id || null;
      renderAll();
    }
  });

  if (!chats.some(c => c.id === activeId)) {
    activeId = chats[0]?.id || null;
  }
  if (!activeId) {
    const chat = {
      id: makeId(), title: "New chat", messages: [],
      createdAt: Date.now(), updatedAt: Date.now()
    };
    chats.unshift(chat);
    activeId = chat.id;
  }

  saveChats();
  renderAll();
  checkStatus();
  setInterval(checkStatus, 15000);
})();
</script>
</body>
</html>
